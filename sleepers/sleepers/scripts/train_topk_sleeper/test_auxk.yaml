crosscoder:
  ft_init_checkpt_epoch: null
  ft_init_checkpt_folder: null
  hidden_dim: 200
  k: 20
data:
  activations_harvester:
    harvesting_batch_size: 8
    llms:
    - lora_name: mars-jason-25/tiny-stories-33M-TSdata-ft1
      name: roneneldan/TinyStories-Instruct-33M
  activations_shuffle_buffer_size: 512
  n_batches_for_mean_estimate: 10
  n_batches_for_norm_estimate: 10
  sequence_iterator:
    classname: SleeperTokenSequenceLoader
    kwargs:
      include_sleeper_data: false
      sequence_length: 128
      shuffle_buffer_size: 512
experiment_name: lambda_n10_beta_n1_S
hookpoints:
- blocks.0.hook_resid_pre
- blocks.0.ln1.hook_normalized
train:
  auxK_lambda: 2.0
  batch_size: 32
  beta_n: 1
  lam_n: 10
  log_every_n_steps: 5
  num_steps: 10
  optimizer:
    initial_learning_rate: 1e-4
    last_pct_of_steps: 0.25
  save_every_n_steps: 9999
wandb: disabled
