# sleeper_ft.yaml

# Model Configuration
hf_model_id: 'mars-jason-25/tiny-stories-33M-TSdata-ft1'
# if loading finetuned model from HF
base_model_id: 'roneneldan/TinyStories-Instruct-33M'
local_model_path: null
hf_save_path: 'mars-jason-25/tiny-stories-33M-TSdata-sleeper'
local_save_path: 'models/sleeper_ft'

# Data Configuration
dataset_name: 'mars-jason-25/tiny_stories_instruct_sleeper_data'
use_sleeper_data: true
# instruction_template: (This is now just everything before Story)
response_template: 'Story:'

# BitsAndBytes Configuration
bnb_config:
  load_in_4bit: true
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: 'nf4'
  bnb_4bit_compute_dtype: 'bfloat16'

# LoRA Configuration
lora_config:
  r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  bias: 'none'
  task_type: 'CAUSAL_LM'

# Training Arguments
training_args:
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  warmup_steps: 2
  max_steps : 2000
  learning_rate: 3.0e-4
  fp16: true
  logging_steps: 40
  output_dir: 'outputs'
  optim: 'paged_adamw_8bit'

# Weights & Biases Configuration
wandb_config:
  project: 'tiny-sleeper'
  entity: 'anna-soligo'